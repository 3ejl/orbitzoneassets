<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Made By Orbit </title>
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/impossiblequiz.png" />
    <link rel="shortcut icon" type="https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/image/x-icon" href="https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/impossiblequiz.png" />
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/js/main.js"></script>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("https://cdn.jsdelivr.net/gh/3ejl/orbitzoneassets@main/ruffle/impossiblequiz.swf");
      });
    </script>
  </body>
</html>
